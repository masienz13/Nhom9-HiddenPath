    <style>
        .detail-hero {
            min-height: 520px;
            display: flex;

        .detail-hero h1 {

            margin: 0 0 18px;

            font-weight: 700;
        }

        .detail-section {

        }

        .detail-layout {
            display: grid;
            grid-template-columns: 2fr .85fr;

            align-items: start;
        }

        .detail-article,

            font-size: 34px;
            line-height: 1.15;

            font-size: 17px;
            text-align: justify;
        }

        .article-image {
            width: 100%;
            height: 390px;
            object-fit: cover;
            border-radius: 16px;
            margin: 28px 0 10px;
            box-shadow: var(--shadow);
        }

        .article-caption {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 14px;
            text-align: center !important;
            font-style: italic;
        }

        .image-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin: 28px 0;
        }

        .image-row img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 14px;
            box-shadow: var(--shadow);
        }

        .detail-sidebar h3 {
            margin: 0 0 20px;
            color: var(--forest);
            font-size: 28px;
        }

        .related-post {
            padding: 16px 0;
            border-bottom: 1px solid var(--line);
        }

        .related-post:last-child {
            border-bottom: 0;
        }

        .related-post a {
            color: var(--forest);
            font-weight: 800;
        }

        .related-post a:hover {
            color: var(--gold-2);
        }

        @media (max-width: 900px) {
            .detail-layout {
                grid-template-columns: 1fr;
            }

            .detail-article,
            .detail-sidebar {
                padding: 28px;
            }

            .article-image {
                height: 300px;
            }

            .image-row {
                grid-template-columns: 1fr;
            }

            .image-row img {
                height: 260px;
            }
